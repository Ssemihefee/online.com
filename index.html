<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crewmate Battle Arena - LAN</title>
    <!-- PeerJS kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- QR Kodu oluşturma kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation; /* Çift dokunma yakınlaştırmasını önler */
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #090a0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: fixed; /* Ekran kaymasını önler */
        }

        /* LOBBY / MENÜ STİLLERİ */
        #lobby {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1c29 0%, #08090d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            cursor: pointer;
            margin: 10px;
        }
        #qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* OYUN EKRANI */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* DOKUNMATİK KONTROLLER */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffcc 0%, #0088cc 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            pointer-events: none;
        }
        #attack-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ff3366 0%, #990033 100%);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            touch-action: none;
        }
        #attack-btn:active {
            transform: scale(0.92);
        }

        /* SKOR VE CAN BARI PANOLARI */
        .hud-panel {
            position: absolute;
            top: 15px;
            width: 42%;
            background: rgba(15, 18, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        #p1-hud { left: 15px; }
        #p2-hud { right: 15px; text-align: right; }
        .player-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .hp-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 7px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease-out;
        }
        #p1-hp { background: #ff3333; }
        #p2-hp { background: #3399ff; }
    </style>
</head>
<body>

    <!-- MENÜ EKRANI -->
    <div id="lobby">
        <div class="title">AMONG BATTLE LAN</div>
        <button id="host-btn" class="btn">ODA KUR (QR OLUŞTUR)</button>
        <div id="qr-box"></div>
        <div id="status">Oyuncu bekleniyor...</div>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-container">
        <canvas id="stage"></canvas>

        <!-- HUD (CAN BARLARI) -->
        <div id="p1-hud" class="hud-panel">
            <div class="player-name" style="color: #ff4444;">OYUNCU 1 (KIRMIZI)</div>
            <div class="hp-bar-bg"><div id="p1-hp" class="hp-bar-fill"></div></div>
        </div>
        <div id="p2-hud" class="hud-panel">
            <div class="player-name" style="color: #4488ff;">OYUNCU 2 (MAVİ)</div>
            <div class="hp-bar-bg"><div id="p2-hp" class="hp-bar-fill"></div></div>
        </div>

        <!-- DOKUNMATİK KONTROLLER -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="attack-btn">VUR</div>
    </div>

    <script>
        // Çift dokunma yakınlaştırmasını tarayıcı seviyesinde tam engelleme
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        canvas.width = screenW;
        canvas.height = screenH;

        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            canvas.width = screenW;
            canvas.height = screenH;
        });

        // OYUN AKTÖRLERİ
        let isHost = false;
        let peer, conn;
        let gameRunning = false;

        let players = {
            p1: { x: 150, y: screenH / 2, vx: 0, vy: 0, hp: 100, color: '#ff3333', facing: 'right', isAttacking: false, attackTimer: 0 },
            p2: { x: screenW - 150, y: screenH / 2, vx: 0, vy: 0, hp: 100, color: '#3399ff', facing: 'left', isAttacking: false, attackTimer: 0 }
        };

        let myRole = 'p1';

        // PEERJS VE QR KOD MANTIĞI
        const urlParams = new URLSearchParams(window.location.search);
        const joinId = urlParams.get('join');

        if (joinId) {
            document.getElementById('host-btn').style.display = 'none';
            document.getElementById('status').innerText = "Odaya bağlanılıyor...";
            myRole = 'p2';
            initClient(joinId);
        }

        document.getElementById('host-btn').onclick = () => {
            document.getElementById('host-btn').style.display = 'none';
            isHost = true;
            myRole = 'p1';
            initHost();
        };

        function initHost() {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('qr-box').style.display = 'block';
                document.getElementById('qr-box').innerHTML = "";
                
                const joinUrl = window.location.origin + window.location.pathname + "?join=" + id;
                new QRCode(document.getElementById("qr-box"), {
                    text: joinUrl,
                    width: 160,
                    height: 160
                });
                document.getElementById('status').innerText = "İkinci telefon ile QR Kodu taratın!";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function initClient(targetId) {
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetId);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            });

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    players = data.players;
                    updateHUD();
                } else if (data.type === 'input') {
                    if (isHost) {
                        players.p2.vx = data.vx;
                        players.p2.vy = data.vy;
                        if (data.attack && !players.p2.isAttacking) {
                            triggerAttack('p2');
                        }
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('p1-hp').style.width = Math.max(0, players.p1.hp) + '%';
            document.getElementById('p2-hp').style.width = Math.max(0, players.p2.hp) + '%';
        }

        // ÇOKLU DOKUNMA (MULTI-TOUCH) VE JOYSTICK SİSTEMİ
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyPointerId = null;
        let joyCenter = { x: 0, y: 0 };
        let inputVx = 0, inputVy = 0;

        joyZone.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (joyPointerId !== null) return;
            joyPointerId = e.pointerId;
            joyZone.setPointerCapture(e.pointerId);
            
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            moveKnob(e.clientX, e.clientY);
        });

        joyZone.addEventListener('pointermove', (e) => {
            if (e.pointerId === joyPointerId) {
                e.preventDefault();
                moveKnob(e.clientX, e.clientY);
            }
        });

        const resetJoystick = (e) => {
            if (e.pointerId === joyPointerId) {
                e.preventDefault();
                joyPointerId = null;
                joyKnob.style.transform = `translate(0px, 0px)`;
                inputVx = 0;
                inputVy = 0;
                sendInput();
            }
        };

        joyZone.addEventListener('pointerup', resetJoystick);
        joyZone.addEventListener('pointercancel', resetJoystick);

        function moveKnob(x, y) {
            let dx = x - joyCenter.x;
            let dy = y - joyCenter.y;
            let dist = Math.hypot(dx, dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            inputVx = (dx / maxDist) * 5;
            inputVy = (dy / maxDist) * 5;
            sendInput();
        }

        // SALDIRI BUTONU (ÇOKLU DOKUNMA UYUMLU)
        const attackBtn = document.getElementById('attack-btn');
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (isHost) {
                if (!players.p1.isAttacking) triggerAttack('p1');
            } else {
                sendInput(true);
            }
        });

        function sendInput(attack = false) {
            if (isHost) {
                players.p1.vx = inputVx;
                players.p1.vy = inputVy;
            } else if (conn && conn.open) {
                conn.send({ type: 'input', vx: inputVx, vy: inputVy, attack: attack });
            }
        }

        function triggerAttack(role) {
            let p = players[role];
            p.isAttacking = true;
            p.attackTimer = 15;

            let enemyRole = role === 'p1' ? 'p2' : 'p1';
            let enemy = players[enemyRole];

            let dx = enemy.x - p.x;
            let dy = enemy.y - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist < 65) {
                enemy.hp -= 10;
                if (enemy.hp < 0) enemy.hp = 0;
            }
        }

        // FİZİK VE GÜNCELLEME
        function updatePhysics() {
            ['p1', 'p2'].forEach(key => {
                let p = players[key];
                
                p.x += p.vx;
                p.y += p.vy;

                p.x = Math.max(25, Math.min(screenW - 25, p.x));
                p.y = Math.max(25, Math.min(screenH - 25, p.y));

                if (p.vx > 0.5) p.facing = 'right';
                if (p.vx < -0.5) p.facing = 'left';

                if (p.isAttacking) {
                    p.attackTimer--;
                    if (p.attackTimer <= 0) p.isAttacking = false;
                }
            });

            if (conn && conn.open) {
                conn.send({ type: 'state', players: players });
            }
            updateHUD();
        }

        // ÇİZİM MOTORU
        function drawCrewmate(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            if (p.facing === 'left') ctx.scale(-1, 1);

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 20, 18, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = p.color;
            ctx.fillRect(-22, -10, 8, 20);

            ctx.beginPath();
            ctx.arc(0, -5, 16, Math.PI, 0);
            ctx.rect(-16, -5, 32, 22);
            ctx.fill();

            ctx.fillRect(-14, 15, 10, 10);
            ctx.fillRect(4, 15, 10, 10);

            ctx.fillStyle = '#aaddff';
            ctx.beginPath();
            ctx.ellipse(4, -5, 10, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (p.isAttacking) {
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(10, 0, 30, -Math.PI / 4, Math.PI / 4);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMap() {
            ctx.fillStyle = '#0d111a';
            ctx.fillRect(0, 0, screenW, screenH);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < screenW; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, screenH); ctx.stroke();
            }
            for (let y = 0; y < screenH; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(screenW, y); ctx.stroke();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (isHost) updatePhysics();

            drawMap();
            drawCrewmate(players.p1);
            drawCrewmate(players.p2);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
