<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN İki Kişilik Oyun</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        #menu { background: #222; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; max-width: 90%; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button.baglanBtn { background: #007bff; }
        textarea { width: 100%; height: 80px; font-size: 12px; margin: 10px 0; background: #333; color: #fff; border: 1px solid #555; }
        canvas { background: #000; border: 3px solid #fff; display: block; margin: 20px auto; touch-action: none; max-width: 100%; }
        #durum { font-size: 18px; color: yellow; margin: 10px; }
    </style>
</head>
<body>

    <h1>LAN İki Kişilik Oyun</h1>
    
    <div id="menu">
        <div id="adim1">
            <h3>1. Adım: Oda Kur</h3>
            <button id="odaKurBtn">Oda Verisi Üret</button>
            <br>
            <textarea id="kurucuVerisi" placeholder="Burada çıkan kodu kopyala ve 2. cihaza ver"></textarea>
        </div>

        <hr style="border-color: #444; margin: 15px 0;">

        <div id="adim2">
            <h3>2. Adım: Bağlan</h3>
            <textarea id="gelenVeri" placeholder="Diğer cihazdan aldığın kodu buraya yapıştır"></textarea>
            <br>
            <button id="baglanBtn" class="baglanBtn">Bağlantıyı Tamamla</button>
        </div>
    </div>

    <div id="durum">Durum: Bekleniyor...</div>
    <canvas id="oyun" width="350" height="350"></canvas>

    <script>
        const canvas = document.getElementById("oyun");
        const ctx = canvas.getContext("2d");

        let pc;
        let dataChannel;

        let benimKarem = { x: 50, y: 50, renk: "red" };
        let digerKarem = { x: 200, y: 200, renk: "blue" };

        // WebRTC bağlantı ayarları (Harici sunucu gerektirmez)
        function pcOlustur() {
            pc = new RTCPeerConnection({
                iceServers: [] // Tamamen yerel ağ (LAN) çalışması için boş bırakıldı
            });

            pc.onicecandidate = (e) => {
                if (!e.candidate) {
                    // Tüm ağ bilgileri toplandı, kutuya yaz
                    document.getElementById("kurucuVerisi").value = JSON.stringify(pc.localDescription);
                }
            };
        }

        // 1. CİHAZ: Oda Kurma
        document.getElementById("odaKurBtn").addEventListener("click", async () => {
            pcOlustur();
            dataChannel = pc.createDataChannel("oyunKanalı");
            veriKanaliniAyarla();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            document.getElementById("durum").innerText = "Kod üretildi. Kodu kopyalayıp 2. cihaza aktar.";
        });

        // 2. CİHAZ: Bağlanma (1. AŞAMA)
        document.getElementById("baglanBtn").addEventListener("click", async () => {
            const metin = document.getElementById("gelenVeri").value.trim();
            if(!metin) {
                alert("Lütfen kodu kutuya yapıştır!");
                return;
            }

            pcOlustur();

            pc.ondatachannel = (e) => {
                dataChannel = e.channel;
                veriKanaliniAyarla();
            };

            const remoteDesc = JSON.parse(metin);
            await pc.setRemoteDescription(remoteDesc);

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            // Cevap kodunu 1. cihaza geri götürmek için kutuya yazacağız
            pc.onicecandidate = (e) => {
                if (!e.candidate) {
                    document.getElementById("kurucuVerisi").value = JSON.stringify(pc.localDescription);
                    document.getElementById("durum").innerText = "Cevap kodu üretildi! Bu kodu alıp 1. cihaza geri yapıştır.";
                }
            };
        });

        function veriKanaliniAyarla() {
            dataChannel.onopen = () => {
                document.getElementById("durum").innerText = "BAĞLANTI BAŞARILI! Oyuna başlayın.";
                document.getElementById("menu").style.display = "none";
            };

            dataChannel.onmessage = (e) => {
                const data = JSON.parse(e.data);
                digerKarem.x = data.x;
                digerKarem.y = data.y;
            };
        }

        // Ekrana dokunma
        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            benimKarem.x = e.clientX - rect.left;
            benimKarem.y = e.clientY - rect.top;

            if (dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(JSON.stringify({ x: benimKarem.x, y: benimKarem.y }));
            }
        });

        // Oyun Çizimi
        function ciz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = benimKarem.renk;
            ctx.fillRect(benimKarem.x - 15, benimKarem.y - 15, 30, 30);
            ctx.fillStyle = digerKarem.renk;
            ctx.fillRect(digerKarem.x - 15, digerKarem.y - 15, 30, 30);
            requestAnimationFrame(ciz);
        }
        ciz();
    </script>
</body>
</html>
