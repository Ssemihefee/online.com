<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crewmate Battle Arena - LAN</title>
    <!-- PeerJS kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- QR Kodu oluşturma kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #090a0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* LOBBY / MENÜ STİLLERİ */
        #lobby {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1c29 0%, #08090d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow-y: auto;
            padding: 20px;
        }
        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #aaa;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            background: #111420;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }
        .color-opt {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-opt.selected {
            border-color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            font-weight: bold;
            font-size: 18px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            cursor: pointer;
            margin: 10px;
        }
        #qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }
        #status {
            margin-top: 10px;
            font-size: 15px;
            color: #ffcc00;
            font-weight: bold;
            text-align: center;
            padding: 0 10px;
        }
        .screen-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* OYUN EKRANI */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* DOKUNMATİK KONTROLLER */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffcc 0%, #0088cc 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            pointer-events: none;
        }
        #attack-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ff3366 0%, #990033 100%);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            touch-action: none;
        }
        #attack-btn:active {
            transform: scale(0.92);
        }

        /* HUD (CAN BARLARI & İSİMLER) */
        .hud-panel {
            position: absolute;
            top: 15px;
            width: 42%;
            background: rgba(15, 18, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        #p1-hud { left: 15px; }
        #p2-hud { right: 15px; text-align: right; }
        .player-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hp-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 7px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease-out;
        }

        /* BİTİŞ EKRANI */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 13, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        #winnerText {
            font-size: 32px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            margin-bottom: 15px;
            text-align: center;
            padding: 0 10px;
        }
        #restartStatus {
            font-size: 16px;
            color: #00ffcc;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* EKRAN TİTREME ANİMASYONU */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 6px) rotate(-1deg); }
            40% { transform: translate(8px, -4px) rotate(1deg); }
            60% { transform: translate(-6px, -6px) rotate(0deg); }
            80% { transform: translate(6px, 4px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .screen-shake {
            animation: shake 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- MENÜ / LOBBY EKRANI -->
    <div id="lobby">
        <div class="title">AMONG BATTLE ARENA</div>

        <!-- 1. AŞAMA: Odayı Kur veya Katıl -->
        <div id="setup-section" class="screen-section">
            <button id="host-btn" class="btn">ODA KUR (QR OLUŞTUR)</button>
            <div id="qr-box"></div>
            <div id="status">Bekleniyor...</div>
        </div>

        <!-- 2. AŞAMA: Bağlandıktan Sonra İsim ve Renk Seçimi -->
        <div id="custom-section" class="screen-section" style="display:none;">
            <div id="connection-success-msg" style="color: #00ffcc; font-weight: bold; margin-bottom: 15px; font-size: 18px;">BAĞLANTI BAŞARILI!</div>
            
            <div class="input-group">
                <label>OYUNCU İSMİNİZ</label>
                <input type="text" id="playerNameInput" maxlength="12" value="Oyuncu">
            </div>

            <div class="input-group">
                <label>KARAKTER RENGİ</label>
                <div class="color-picker">
                    <div class="color-opt selected" data-color="#ff3333" style="background:#ff3333;"></div>
                    <div class="color-opt" data-color="#3399ff" style="background:#3399ff;"></div>
                    <div class="color-opt" data-color="#28a745" style="background:#28a745;"></div>
                    <div class="color-opt" data-color="#ffcc00" style="background:#ffcc00;"></div>
                    <div class="color-opt" data-color="#a020f0" style="background:#a020f0;"></div>
                </div>
            </div>

            <button id="ready-btn" class="btn">OYUNA BAŞLA</button>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-container">
        <canvas id="stage"></canvas>

        <!-- HUD (CAN BARLARI) -->
        <div id="p1-hud" class="hud-panel">
            <div id="p1-name-display" class="player-name" style="color: #ff4444;">OYUNCU 1</div>
            <div class="hp-bar-bg"><div id="p1-hp" class="hp-bar-fill"></div></div>
        </div>
        <div id="p2-hud" class="hud-panel">
            <div id="p2-name-display" class="player-name" style="color: #4488ff;">OYUNCU 2</div>
            <div class="hp-bar-bg"><div id="p2-hp" class="hp-bar-fill"></div></div>
        </div>

        <!-- DOKUNMATİK KONTROLLER -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="attack-btn">VUR</div>

        <!-- BİTİŞ EKRANI -->
        <div id="game-over-screen">
            <div id="winnerText">KAZANAN</div>
            <div id="restartStatus">Tekrar oynamak için ikiniz de butona basın!</div>
            <button id="restartBtn" class="btn">TEKRAR OYNA</button>
        </div>
    </div>

    <script>
        // Tarayıcı çift dokunma yakınlaştırmasını önleme
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        canvas.width = screenW;
        canvas.height = screenH;

        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            canvas.width = screenW;
            canvas.height = screenH;
        });

        // ---------------- WEB AUDIO API SES MOTORU ----------------
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Arka Plan Müziği (Aksiyon ritmi - Synth Melodisi)
        let bgmTimer = null;
        function startBGM() {
            if (bgmTimer) return;
            const notes = [110, 130.81, 146.83, 164.81]; // Düşük bas frekansları
            let step = 0;
            bgmTimer = setInterval(() => {
                if (!gameRunning || gameOver) return;
                initAudio();
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                    step++;
                } catch(e) {}
            }, 300);
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        // Vurma Sesi (Tok darbe efekti)
        function playHitSound() {
            initAudio();
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // Ekran Titretme Fonksiyonu
        function triggerScreenShake() {
            const container = document.getElementById('game-container');
            container.classList.remove('screen-shake');
            void container.offsetWidth; // Reflow tetikle
            container.classList.add('screen-shake');
        }

        // RENK SEÇİMİ
        let selectedColor = '#ff3333';
        document.querySelectorAll('.color-opt').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedColor = opt.getAttribute('data-color');
            });
        });

        // OYUN DURUMU VE AKTÖRLERİ
        let isHost = false;
        let peer, conn;
        let gameRunning = false;
        let gameOver = false;

        let players = {
            p1: { name: 'Oyuncu 1', x: 150, y: screenH / 2, vx: 0, vy: 0, hp: 100, color: '#ff3333', facing: 'right', isAttacking: false, attackTimer: 0, ready: false },
            p2: { name: 'Oyuncu 2', x: screenW - 150, y: screenH / 2, vx: 0, vy: 0, hp: 100, color: '#3399ff', facing: 'left', isAttacking: false, attackTimer: 0, ready: false }
        };

        let myRole = 'p1';

        // URL ile QR Katılım Kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const joinId = urlParams.get('join');

        if (joinId) {
            document.getElementById('host-btn').style.display = 'none';
            document.getElementById('status').innerText = "Odaya bağlanılıyor...";
            myRole = 'p2';
            initClient(joinId);
        }

        document.getElementById('host-btn').onclick = () => {
            initAudio();
            document.getElementById('host-btn').style.display = 'none';
            isHost = true;
            myRole = 'p1';
            initHost();
        };

        function getMyName() {
            let val = document.getElementById('playerNameInput').value.trim();
            return val ? val : (myRole === 'p1' ? 'Oyuncu 1' : 'Oyuncu 2');
        }

        function initHost() {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('qr-box').style.display = 'block';
                document.getElementById('qr-box').innerHTML = "";
                
                const joinUrl = window.location.origin + window.location.pathname + "?join=" + id;
                new QRCode(document.getElementById("qr-box"), {
                    text: joinUrl,
                    width: 160,
                    height: 160
                });
                document.getElementById('status').innerText = "İkinci telefon ile QR Kodu taratın!";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function initClient(targetId) {
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetId);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                // Bağlantı sağlandığında ilk menüyü gizle, isim/renk seçim ekranını aç
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('custom-section').style.display = 'flex';
                document.getElementById('status').innerText = "";
            });

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    players = data.players;
                    updateHUD();
                    if (data.gameOver) {
                        triggerGameOverScreen(data.winnerText);
                    }
                } else if (data.type === 'player_config') {
                    // Karşı tarafın isim ve renk ayarını kaydet
                    if (isHost) {
                        players.p2.name = data.name;
                        players.p2.color = data.color;
                    } else {
                        players.p1.name = data.name;
                        players.p1.color = data.color;
                    }
                } else if (data.type === 'ready_signal') {
                    if (isHost) {
                        players.p2.ready = true;
                        checkBothReady();
                    }
                } else if (data.type === 'input') {
                    if (isHost && !gameOver) {
                        players.p2.vx = data.vx;
                        players.p2.vy = data.vy;
                        if (data.attack && !players.p2.isAttacking) {
                            triggerAttack('p2');
                        }
                    }
                } else if (data.type === 'restart_ready') {
                    if (isHost) {
                        players.p2.ready = true;
                        checkRestartBothReady();
                    }
                }
            });
        }

        // OYUNA BAŞLA (LOBBY HAZIR BUTONU)
        document.getElementById('ready-btn').onclick = () => {
            initAudio();
            let myName = getMyName();
            let myColor = selectedColor;

            if (isHost) {
                players.p1.name = myName;
                players.p1.color = myColor;
                players.p1.ready = true;
                if (conn && conn.open) {
                    conn.send({ type: 'player_config', name: myName, color: myColor });
                    conn.send({ type: 'ready_signal' });
                }
                checkBothReady();
            } else {
                players.p2.name = myName;
                players.p2.color = myColor;
                players.p2.ready = true;
                if (conn && conn.open) {
                    conn.send({ type: 'player_config', name: myName, color: myColor });
                    conn.send({ type: 'ready_signal' });
                }
                document.getElementById('ready-btn').innerText = "Rakip Bekleniyor...";
                document.getElementById('ready-btn').style.opacity = "0.6";
            }
        };

        function checkBothReady() {
            if (players.p1.ready && players.p2.ready) {
                startTheGame();
            }
        }

        function startTheGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            gameRunning = true;
            gameOver = false;
            startBGM();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('p1-name-display').innerText = players.p1.name;
            document.getElementById('p1-name-display').style.color = players.p1.color;
            document.getElementById('p1-hp').style.width = Math.max(0, players.p1.hp) + '%';
            document.getElementById('p1-hp').style.background = players.p1.color;

            document.getElementById('p2-name-display').innerText = players.p2.name;
            document.getElementById('p2-name-display').style.color = players.p2.color;
            document.getElementById('p2-hp').style.width = Math.max(0, players.p2.hp) + '%';
            document.getElementById('p2-hp').style.background = players.p2.color;
        }

        // BİTİŞ EKRANI
        function triggerGameOverScreen(winnerText) {
            gameOver = true;
            stopBGM();
            document.getElementById('winnerText').innerText = winnerText;
            document.getElementById('restartStatus').innerText = "Tekrar oynamak için ikiniz de butona basın!";
            document.getElementById('restartBtn').innerText = "TEKRAR OYNA";
            document.getElementById('restartBtn').style.opacity = "1";
            document.getElementById('restartBtn').disabled = false;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        // TEKRAR OYNA BUTONU (İki taraflı onay mekanizması)
        document.getElementById('restartBtn').onclick = () => {
            initAudio();
            document.getElementById('restartBtn').innerText = "Rakip Bekleniyor...";
            document.getElementById('restartBtn').style.opacity = "0.6";
            document.getElementById('restartBtn').disabled = true;

            players[myRole].ready = true;

            if (isHost) {
                checkRestartBothReady();
            } else if (conn && conn.open) {
                conn.send({ type: 'restart_ready' });
            }
        };

        function checkRestartBothReady() {
            if (players.p1.ready && players.p2.ready) {
                // Her iki taraf da hazır, maçı sıfırla
                players.p1.ready = false;
                players.p2.ready = false;
                resetMatch();
            }
        }

        function resetMatch() {
            gameOver = false;
            document.getElementById('game-over-screen').style.display = 'none';
            players.p1.hp = 100;
            players.p2.hp = 100;
            players.p1.x = 150;
            players.p1.y = screenH / 2;
            players.p2.x = screenW - 150;
            players.p2.y = screenH / 2;
            players.p1.vx = 0; players.p1.vy = 0;
            players.p2.vx = 0; players.p2.vy = 0;
            
            startBGM();
            if (isHost && conn && conn.open) {
                conn.send({ type: 'state', players: players, gameOver: false, winnerText: '' });
            }
        }

        // ÇOKLU DOKUNMA VE JOYSTICK SİSTEMİ
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyPointerId = null;
        let joyCenter = { x: 0, y: 0 };
        let inputVx = 0, inputVy = 0;

        joyZone.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (joyPointerId !== null || gameOver) return;
            joyPointerId = e.pointerId;
            joyZone.setPointerCapture(e.pointerId);
            
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            moveKnob(e.clientX, e.clientY);
        });

        joyZone.addEventListener('pointermove', (e) => {
            if (e.pointerId === joyPointerId && !gameOver) {
                e.preventDefault();
                moveKnob(e.clientX, e.clientY);
            }
        });

        const resetJoystick = (e) => {
            if (e.pointerId === joyPointerId) {
                e.preventDefault();
                joyPointerId = null;
                joyKnob.style.transform = `translate(0px, 0px)`;
                inputVx = 0;
                inputVy = 0;
                sendInput();
            }
        };

        joyZone.addEventListener('pointerup', resetJoystick);
        joyZone.addEventListener('pointercancel', resetJoystick);

        function moveKnob(x, y) {
            let dx = x - joyCenter.x;
            let dy = y - joyCenter.y;
            let dist = Math.hypot(dx, dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            inputVx = (dx / maxDist) * 5;
            inputVy = (dy / maxDist) * 5;
            sendInput();
        }

        // SALDIRI BUTONU
        const attackBtn = document.getElementById('attack-btn');
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameOver) return;
            if (isHost) {
                if (!players.p1.isAttacking) triggerAttack('p1');
            } else {
                sendInput(true);
            }
        });

        function sendInput(attack = false) {
            if (isHost) {
                players.p1.vx = inputVx;
                players.p1.vy = inputVy;
            } else if (conn && conn.open) {
                conn.send({ type: 'input', vx: inputVx, vy: inputVy, attack: attack });
            }
        }

        function triggerAttack(role) {
            let p = players[role];
            p.isAttacking = true;
            p.attackTimer = 15;

            playHitSound();
            triggerScreenShake();

            let enemyRole = role === 'p1' ? 'p2' : 'p1';
            let enemy = players[enemyRole];

            let dx = enemy.x - p.x;
            let dy = enemy.y - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist < 70) {
                enemy.hp -= 10;
                if (enemy.hp <= 0) {
                    enemy.hp = 0;
                    let winnerName = p.name + " KAZANDI!";
                    triggerGameOverScreen(winnerName);
                }
            }
        }

        // FİZİK VE GÜNCELLEME
        function updatePhysics() {
            if (gameOver) return;

            ['p1', 'p2'].forEach(key => {
                let p = players[key];
                
                p.x += p.vx;
                p.y += p.vy;

                p.x = Math.max(25, Math.min(screenW - 25, p.x));
                p.y = Math.max(25, Math.min(screenH - 25, p.y));

                if (p.vx > 0.5) p.facing = 'right';
                if (p.vx < -0.5) p.facing = 'left';

                if (p.isAttacking) {
                    p.attackTimer--;
                    if (p.attackTimer <= 0) p.isAttacking = false;
                }
            });

            if (conn && conn.open) {
                let winnerText = gameOver ? document.getElementById('winnerText').innerText : '';
                conn.send({ type: 'state', players: players, gameOver: gameOver, winnerText: winnerText });
            }
            updateHUD();
        }

        // ÇİZİM MOTORU (GÖLGELER, ANİMASYONLU SALDIRI EFEKTİ)
        function drawCrewmate(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            // İsmi Karakterin Üstüne Çiz
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, 0, -32);

            if (p.facing === 'left') ctx.scale(-1, 1);

            // Gölge
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 20, 18, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Sırt Çantası
            ctx.fillStyle = p.color;
            ctx.fillRect(-22, -10, 8, 20);

            // Gövde
            ctx.beginPath();
            ctx.arc(0, -5, 16, Math.PI, 0);
            ctx.rect(-16, -5, 32, 22);
            ctx.fill();

            // Bacaklar (Yürüme Efekti İçin Hafif Titreşim)
            let legOffset = (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) ? Math.sin(Date.now() / 60) * 4 : 0;
            ctx.fillRect(-14, 15 + legOffset, 8, 10);
            ctx.fillRect(4, 15 - legOffset, 8, 10);

            // Vizör
            ctx.fillStyle = '#aaddff';
            ctx.beginPath();
            ctx.ellipse(4, -5, 10, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Saldırı Kılıç/Savurma Efekti Animasyonu
            if (p.isAttacking) {
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(15, 0, 35, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMap() {
            ctx.fillStyle = '#0d111a';
            ctx.fillRect(0, 0, screenW, screenH);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < screenW; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, screenH); ctx.stroke();
            }
            for (let y = 0; y < screenH; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(screenW, y); ctx.stroke();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (isHost) updatePhysics();

            drawMap();
            drawCrewmate(players.p1);
            drawCrewmate(players.p2);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
