<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Uzay Kaçışı Oyunu</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid #0f3460;
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { margin-top: 10px; color: #a2a8d3; }
    </style>
</head>
<body>

    <h1>Uzay Kaçışı - Skor: <span id="skor">0</span></h1>
    <canvas id="oyunAlani" width="400" height="500"></canvas>
    <p>Kontroller: Sağ ve Sol Ok Tuşları | Yeniden Başlamak için: F5</p>

    <script>
        const canvas = document.getElementById("oyunAlani");
        const ctx = canvas.getContext("2d");
        const skorElement = document.getElementById("skor");

        let oyuncu = { x: 180, y: 440, genislik: 40, yukseklik: 40, hiz: 6 };
        let engeller = [];
        let skor = 0;
        let oyunBitti = false;
        let tuslar = {};

        document.addEventListener("keydown", (e) => tuslar[e.key] = true);
        document.addEventListener("keyup", (e) => tuslar[e.key] = false);

        function engelOlustur() {
            if (oyunBitti) return;
            let genislik = Math.random() * 60 + 30;
            let x = Math.random() * (canvas.width - genislik);
            engeller.push({ x: x, y: -30, genislik: genislik, yukseklik: 20, hiz: 3 + (skor * 0.1) });
        }

        function guncelle() {
            if (oyunBitti) return;

            if (tuslar["ArrowLeft"] && oyuncu.x > 0) oyuncu.x -= oyuncu.hiz;
            if (tuslar["ArrowRight"] && oyuncu.x < canvas.width - oyuncu.genislik) oyuncu.x += oyuncu.hiz;

            for (let i = 0; i < engeller.length; i++) {
                let e = engeller[i];
                e.y += e.hiz;

                // Çarpışma kontrolü
                if (oyuncu.x < e.x + e.genislik &&
                    oyuncu.x + oyuncu.genislik > e.x &&
                    oyuncu.y < e.y + e.yukseklik &&
                    oyuncu.y + oyuncu.yukseklik > e.y) {
                    oyunBitti = true;
                    alert("Oyun Bitti! Skorunuz: " + skor);
                }

                // Ekrandan çıkan engelleri temizle ve puan ekle
                if (e.y > canvas.height) {
                    engeller.splice(i, 1);
                    skor++;
                    skorElement.innerText = skor;
                    i--;
                }
            }
        }

        function ciz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Oyuncuyu çiz
            ctx.fillStyle = "#e94560";
            ctx.fillRect(oyuncu.x, oyuncu.y, oyuncu.genislik, oyuncu.yukseklik);

            // Engelleri çiz
            ctx.fillStyle = "#4ecca3";
            for (let e of engeller) {
                ctx.fillRect(e.x, e.y, e.genislik, e.yukseklik);
            }
        }

        function oyunDongusu() {
            guncelle();
            ciz();
            if (!oyunBitti) requestAnimationFrame(oyunDongusu);
        }

        setInterval(engelOlustur, 900);
        oyunDongusu();
    </script>
</body>
</html>
