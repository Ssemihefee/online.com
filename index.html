<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tek Tıkla İki Kişilik Oyun</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        #menu { background: #222; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; }
        button { background: #28a745; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 8px; cursor: pointer; }
        canvas { background: #000; border: 3px solid #fff; display: block; margin: 20px auto; touch-action: none; max-width: 100%; }
        #durum { font-size: 20px; color: yellow; margin: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Tek Tıkla Karşılıklı Oyun</h1>
    
    <div id="menu">
        <p>İki telefonda da bu sayfayı aç ve aşağıdaki tuşa bas:</p>
        <button id="baslaBtn">OYUNA BAŞLA</button>
    </div>

    <div id="durum">Bekleniyor...</div>
    <canvas id="oyun" width="350" height="350"></canvas>

    <script>
        const canvas = document.getElementById("oyun");
        const ctx = canvas.getContext("2d");

        let peer, conn;
        let benimKarem = { x: 50, y: 50, renk: "red" };
        let digerKarem = { x: 200, y: 200, renk: "blue" };

        // Sabit ve ortak bir oda ismi üretiyoruz (Aynı Wi-Fi'dakiler otomatik buluşsun diye)
        // Telefonların tarayıcı saatine göre ortak bir saniye aralığı kullanıyoruz
        document.getElementById("baslaBtn").addEventListener("click", () => {
            document.getElementById("durum").innerText = "Bağlanıyor...";
            document.getElementById("menu").style.display = "none";

            // Rastgele bir ID yerine sabit ortak kanal açıyoruz
            peer = new Peer("lanoyunu-ortak-oda-12345");

            peer.on("open", (id) => {
                // Eğer bu ID'yi alan ilk cihazsa (Sunucu)
                document.getElementById("durum").innerText = "Oda Kuruldu! 2. cihaz bekleniyor...";
            });

            peer.on("error", (err) => {
                // Eğer bu ID'yi zaten başka biri (1. cihaz) aldıysa, o zaman 2. cihaz olarak bağlan
                baglanIkinciCihaz();
            });
        });

        function baglanIkinciCihaz() {
            peer = new Peer(); // Yeni rastgele kimlik al
            peer.on("open", () => {
                conn = peer.connect("lanoyunu-ortak-oda-12345");
                baglantiAyarla();
            });
        }

        // 1. Cihaz bağlanan kişiyi yakalarsa
        peer && peer.on("connection", (connection) => {
            conn = connection;
            baglantiAyarla();
        });

        function baglantiAyarla() {
            document.getElementById("durum").innerText = "BAĞLANDI! OYNAYABİLİRSİNİZ.";
            
            conn.on("data", (data) => {
                digerKarem.x = data.x;
                digerKarem.y = data.y;
            });
        }

        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            benimKarem.x = e.clientX - rect.left;
            benimKarem.y = e.clientY - rect.top;

            if (conn && conn.open) {
                conn.send({ x: benimKarem.x, y: benimKarem.y });
            }
        });

        function ciz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = benimKarem.renk;
            ctx.fillRect(benimKarem.x - 15, benimKarem.y - 15, 30, 30);
            ctx.fillStyle = digerKarem.renk;
            ctx.fillRect(digerKarem.x - 15, digerKarem.y - 15, 30, 30);
            requestAnimationFrame(ciz);
        }
        ciz();
    </script>
</body>
</html>
